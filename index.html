<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrologer Sri Vidyashankar | Astrotalk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{--y:#f6e421;--bg:#0b0b0b;--card:#0a0606}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;justify-content:center;overflow-x:hidden;position:relative}
.wheel{position:fixed;right:-420px;top:60px;width:620px;height:620px;border-radius:50%;border:1px solid rgba(246,228,33,.12);opacity:.8;pointer-events:none}
.wheel::before,.wheel::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(246,228,33,.1)}
.wheel::before{inset:55px}.wheel::after{inset:140px}
.wheel i{position:absolute;color:rgba(246,228,33,.55);font-style:normal;font-size:16px}
main{width:100%;max-width:680px;position:relative}
header{background:#080404;height:88px;display:flex;align-items:center;justify-content:center;gap:14px}
header img{height:56px;width:auto;max-width:80%}
.logo{width:52px;height:52px;border-radius:50%;background:var(--y);display:grid;place-items:center}
.logo span{width:26px;height:26px;border-radius:50%;border:2px solid #222;position:relative}
.logo span::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#222}
header b{font-weight:400;font-size:30px;letter-spacing:.5px}
.hero{position:relative;background:var(--card)}
.hero img{display:block;width:100%;height:auto}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.18) 35%, rgba(0,0,0,.6) 65%, rgba(5,3,3,.96) 100%);pointer-events:none}
.title{text-align:center;padding:0 20px 28px;margin-top:-108px;position:relative;z-index:2}
.title em{display:block;color:var(--y);font-size:48px;font-weight:500;font-style:italic;letter-spacing:1.5px;line-height:1.15;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.title h1{font-size:44px;font-weight:700;line-height:1.2;letter-spacing:-.5px;margin-top:4px;text-shadow:0 2px 14px rgba(0,0,0,.55)}
.title hr{width:56px;margin:22px auto 0;border:0;border-top:3px solid var(--y);border-radius:3px}
.bio{text-align:center;font-size:21px;line-height:1.6;padding:30px 50px 0;font-weight:400}
.tags{display:flex;width:max-content;max-width:calc(100% - 20px);margin:28px auto 0;border:1px solid rgba(246,228,33,.3);border-radius:10px;overflow:hidden;font-size:20px;background:rgba(255,255,255,.03)}
.tags div{padding:12px 24px;white-space:nowrap;color:#f2f2f2}
.tags div+div{border-left:1px solid rgba(246,228,33,.3)}
.tags span{color:var(--y)}
.stats{display:flex;justify-content:center;gap:56px;margin-top:38px;text-align:center}
.stats svg{width:42px;height:42px;stroke:var(--y);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.stats b{display:block;font-size:21px;font-weight:600;margin-top:8px}
.stats small{font-size:16px;font-style:italic;font-weight:400}
.cta{display:flex;align-items:center;justify-content:center;gap:18px;width:max-content;max-width:calc(100% - 20px);margin:40px auto 60px;background:var(--y);color:#000;text-decoration:none;font-weight:600;font-size:28px;padding:24px 40px;border-radius:50px;box-shadow:0 0 30px rgba(246,228,33,.35)}
.cta svg{width:20px;height:20px;stroke:#111;fill:none;stroke-width:2}
.more{text-align:center;font-size:36px;font-style:italic;margin-top:30px;padding-bottom:60px}
.more b{font-style:normal;font-weight:700}
@media(max-width:680px){
header{height:64px}header img{height:38px}
.hero::after{top:auto;bottom:0;height:68%}
.title{margin-top:-19vw;padding:0 22px 22px}
.title em{font-size:8.8vw;letter-spacing:.5px}.title h1{font-size:8.2vw;margin-top:2vw}.title hr{margin-top:16px}
.bio{font-size:4vw;padding:20px 20px 0;line-height:1.55}
.tags{font-size:3.6vw;margin-top:22px;width:calc(100% - 32px);max-width:none;background:rgba(255,255,255,.04)}
.tags div{flex:1;text-align:center;padding:12px 4px;white-space:normal;font-weight:500}
.stats{gap:6vw;margin-top:26px}.stats svg{width:32px;height:32px}.stats b{font-size:4vw}.stats small{font-size:3.2vw}
.cta{font-size:5.4vw;padding:4.6vw 6vw;gap:3vw;margin-top:30px;width:calc(100% - 32px);letter-spacing:.2px}
.more{font-size:6.5vw;margin-top:22px;padding-bottom:40px}
.wheel{display:none}}
</style>
</head>
<body>
<div class="wheel">
<i style="left:50%;top:-4%">♑</i><i style="left:75%;top:8%">♒</i><i style="left:9%;top:20%">♐</i><i style="left:2%;top:50%">♋</i><i style="left:12%;top:80%">♊</i><i style="left:62%;top:96%">♌</i><i style="left:95%;top:80%">♓</i><i style="left:30%;top:90%">♉</i>
</div>
<main>
<header><img src="logo.png" alt="Astrotalk"></header>
<section class="hero"><img src="pfp.png" alt="Astrologer Sri Vidyashankar"></section>
<div class="title"><em>Astrologer</em><h1>Sri Vidyashankar</h1><hr></div>
<div class="tags"><div>Vedic</div><div>Palmistry</div><div>Numerology</div></div>
<a class="cta" href="https://app.astrotalk.com/7IuK/8qqqrvj7" target="_blank" rel="noopener">Talk to Sri Vidyashankar</a>
</main>
<script>setTimeout(function(){window.open("https://app.astrotalk.com/7IuK/8qqqrvj7","_blank")},7000)</script>
</body>
</html>
